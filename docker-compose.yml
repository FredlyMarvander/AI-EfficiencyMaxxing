services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    dns:
      - 8.8.8.8
      - 8.8.4.4

  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Point the agent at the ollama service, not localhost.
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama

volumes:
  ollama_data:
